<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>curvesel playground</title>
    <style>
      body { font: 15px/1.4 system-ui, sans-serif; margin: 2rem; color: #1f2933; background: #f5f7fa; }
      h1 { font-size: 1.25rem; }
      h1 small, figcaption { font-size: 0.8rem; font-weight: normal; color: #616e7c; }
      form { display: grid; grid-template-columns: 6rem 16rem 5rem; gap: 0.4rem 0.75rem; align-items: center; }
      output { font: 0.85rem ui-monospace, monospace; }
      button { font: inherit; padding: 0.2rem 0.5rem; }
      .error { color: #b42318; min-height: 1.4em; }
      .views { display: flex; flex-wrap: wrap; gap: 1rem; }
      figure { margin: 1rem 0 0; }
      svg { touch-action: none; cursor: grab; width: 22rem; max-width: 100%; aspect-ratio: 1; background: #fff; border: 1px solid #cbd2d9; border-radius: 8px; }
      .slide { stroke: #3e4c59; stroke-width: 3; stroke-linecap: round; }
      .slide.centre { stroke: #c2410c; }
      .facing { stroke: #9aa5b1; stroke-width: 1.5; }
      .hidden { stroke: #cbd2d9; stroke-dasharray: 4 3; }
    </style>
  </head>
  <body>
    <h1>curvesel playground <small>@curvesel/core, by hand</small></h1>
    <form id="options">
      <label for="preset">Preset</label>
      <select id="preset">
        <option value="">(by hand)</option>
        <option value="cylinder">cylinder</option>
        <option value="ribbon">ribbon</option>
        <option value="wheel">wheel</option>
        <option value="arc">arc</option>
      </select>
      <span></span>
      <label for="plane">Plane</label>
      <select id="plane">
        <option value="xz">xz (in depth)</option>
        <option value="yz">yz (wheel)</option>
        <option value="xy">xy (arc, in the screen)</option>
      </select>
      <span></span>
      <label for="count">Slides</label>
      <input id="count" type="range" min="1" max="24" step="1" value="12" />
      <output for="count"></output>
      <label for="curvature">Curvature</label>
      <input id="curvature" type="range" min="-6.284" max="6.284" step="any" value="0" />
      <output for="curvature"></output>
      <label for="gap">Gap (px)</label>
      <input id="gap" type="range" min="0" max="200" step="1" value="20" />
      <output for="gap"></output>
      <label for="size">Size (px)</label>
      <input id="size" type="range" min="0" max="400" step="1" value="200" />
      <output for="size"></output>
      <label for="amplitude">Wave amplitude</label>
      <input id="amplitude" type="range" min="-1" max="1" step="0.01" value="0" />
      <output for="amplitude"></output>
      <label for="wavelength">Wavelength</label>
      <input id="wavelength" type="range" min="1" max="20" step="0.5" value="6" />
      <output for="wavelength"></output>
      <label for="phase">Wave phase</label>
      <input id="phase" type="range" min="-3.14" max="3.14" step="0.01" value="1.57" />
      <output for="phase"></output>
      <label for="wave-plane">Wave plane</label>
      <select id="wave-plane">
        <option value="z">z (in the Curve's Plane)</option>
        <option value="y">y (across it)</option>
      </select>
      <span></span>
      <label for="anchor">Wave anchor</label>
      <select id="anchor">
        <option value="space">space (stays put)</option>
        <option value="ribbon">ribbon (travels)</option>
      </select>
      <span></span>
      <label for="position">Position</label>
      <input id="position" type="range" min="-2" max="25" step="0.01" value="0" />
      <output for="position"></output>
      <label for="loop">Loop</label>
      <input id="loop" type="checkbox" />
      <span></span>
      <span>Track</span>
      <span><button id="previous" type="button">Previous</button> <button id="next" type="button">Next</button></span>
      <span></span>
      <label for="twist">Twist</label>
      <input id="twist" type="range" min="-1.6" max="1.6" step="0.01" value="0" />
      <output for="twist"></output>
      <label for="tilt">Tilt</label>
      <input id="tilt" type="range" min="-3.14" max="3.14" step="0.01" value="0" />
      <output for="tilt"></output>
      <label for="visible-range">Visible range</label>
      <input id="visible-range" type="range" min="0" max="12" step="0.5" value="12" />
      <output for="visible-range"></output>
      <span></span>
      <button id="close-ring" type="button">Curvature = 2π / N</button>
    </form>
    <p class="error" id="error"></p>
    <p>Drag any view. Position: <output id="at">0</output> · phase: <output id="phase">rest</output> · frames requested: <output id="frames">0</output></p>
    <div class="views">
      <figure>
        <svg id="top" role="img" aria-label="Top view of the Curve"></svg>
        <figcaption>Top view: x right, z towards the viewer at the bottom.</figcaption>
      </figure>
      <figure>
        <svg id="front" role="img" aria-label="Front view of the Curve"></svg>
        <figcaption>Front view, as the viewer sees it: x right, y down.</figcaption>
      </figure>
      <figure>
        <svg id="side" role="img" aria-label="Side view of the Curve"></svg>
        <figcaption>Side view: z towards the viewer to the right, y down.</figcaption>
      </figure>
    </div>
    <p><small>Each Slide is drawn along the Curve at its size; the Position is the Track's (0 is the first Slide). Orange: the Active slide. Dashed: hidden. Ticks: where each Slide faces.</small></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
